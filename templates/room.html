<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GetWise</title>
    <meta name="description" content="GetWise - brainstorm your thoughts." />
    <link rel="icon" href="../assets/icons/favicon.ico" />
    <!-- Add your stylesheet here -->
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/room.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <img
            src="../assets/images/logo.png"
            alt="GetWise Logo"
            class="logo-img"
          />
          <a href="../index.html" class="logo">GETWISE</a>
        </div>

        <ul class="nav-links">
          <li><a href="../index.html#features">Features</a></li>
          <li><a href="../index.html#about">About</a></li>
          <li><a href="../index.html#contact">Contact</a></li>
        </ul>
      </nav>

      <hr />
    </header>

    <main>
      <section id="video-streams">
        <div class="left-column">
          <div id="stream-1" class="left-boxes">
            <video id="local-video" height="100%" width="100%" autoplay playsinline muted></video>
          </div>
          <div id="notes" class="left-boxes">
            <textarea
              id="notes-textarea"
              placeholder="Type your notes here..."
            ></textarea>
            <button type="button" id="save-notes">
                SAVE NOTES
            </button>
          </div>
        </div>
        <div id="stream-2" class="right-boxe">
            <video id="remote-video" autoplay playsinline></video>
        </div>
      </section>

      <section id="controls" class="controls">
        <select id="standard-select" class="control-btn">
                <option value="1">1st Standard</option>
                <option value="2">2nd Standard</option>
                <option value="3">3rd Standard</option>
                <option value="4">4th Standard</option>
                <option value="5">5th Standard</option>
                <option value="6">6th Standard</option>
                <option value="7">7th Standard</option>
                <option value="8">8th Standard</option>
                <option value="9">9th Standard</option>
                <option value="10">10th Standard</option>
                <option value="11">11th Standard</option>
                <option value="12">12th Standard</option>
        </select>
        <button id="start-btn" class="control-btn">Start Call</button>
        <button id="mute-btn" class="control-btn">Mute Mic</button>
        <button id="end-btn" class="control-btn">End Call</button>
      </section>
    </main>
    <hr />
    <footer>
      <p>&copy; 2026 GetWise. All rights reserved.</p>
    </footer>

    <!-- Add your scripts here -->
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
